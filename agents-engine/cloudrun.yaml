# =============================================================================
# Google Cloud Run Service Specification — AEGIS Ω Intelligence Engine
# =============================================================================
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: aegis-omega-intelligence-engine
  labels:
    cloud.googleapis.com/location: us-central1
    app: aegis-omega
spec:
  template:
    metadata:
      annotations:
        # Autoscaling bounds (0 for serverless cost savings, scales up under incident burst)
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        # Concurrency: Number of concurrent incident events handled per container
        autoscaling.knative.dev/target: "80"
        # Cloud SQL Unix Socket connection attachment
        run.googleapis.com/cloudsql-instances: "${GCP_PROJECT_ID}:us-central1:aegis-postgres"
        # Keep CPU allocated during background task execution
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/execution-environment: "gen2"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: aegis-omega-runtime-sa@${GCP_PROJECT_ID}.iam.gserviceaccount.com
      containers:
        - image: us-central1-docker.pkg.dev/${GCP_PROJECT_ID}/aegis-docker-repo/aegis-omega-engine:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1000m"
              memory: "1Gi"
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "INFO"
            - name: GCP_PROJECT_ID
              value: "${GCP_PROJECT_ID}"
            - name: GCP_REGION
              value: "us-central1"
            - name: ENABLE_GCP_PUBSUB
              value: "true"
            - name: ENABLE_CLOUD_SQL
              value: "true"
            - name: CLOUD_SQL_CONNECTION_NAME
              value: "${GCP_PROJECT_ID}:us-central1:aegis-postgres"
            - name: CLOUD_SQL_DATABASE
              value: "aegis_omega"
            - name: CLOUD_SQL_USER
              value: "aegis_app"
            - name: CLOUD_SQL_HOST
              value: "/cloudsql/${GCP_PROJECT_ID}:us-central1:aegis-postgres"
            - name: ENABLE_FIRESTORE
              value: "true"
            - name: FIRESTORE_DATABASE_ID
              value: "(default)"
            - name: GEMINI_MODEL
              value: "gemini-2.0-flash"
            # Secure Secret Manager Bindings (Never commit secret plaintext)
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: gemini-api-key
            - name: CLOUD_SQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: cloudsql-db-password
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 15
            failureThreshold: 3
